# Default setup: the app + SQLite stored in a named volume. Nothing else to install.
#   docker compose up --build        -> http://localhost:8080
services:
  wayback:
    build: .
    ports:
      - "8080:8080"
    environment:
      Storage__Provider: Sqlite
      ConnectionStrings__WaybackDb: Data Source=/data/wayback.db
      Storage__HtmlRoot: /data/html-payloads
      Logging__File__Directory: /data/logs
    volumes:
      - wayback-data:/data
    restart: unless-stopped

volumes:
  wayback-data:
