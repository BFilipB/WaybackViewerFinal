<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Wayback Viewer logo">
  <defs>
	<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
	  <stop offset="0%" stop-color="#0f141b"/>
	  <stop offset="100%" stop-color="#1a242c"/>
	</linearGradient>
	<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
	  <stop offset="0%" stop-color="#4c90f0"/>
	  <stop offset="100%" stop-color="#57b7c8"/>
	</linearGradient>
	<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
	  <feGaussianBlur stdDeviation="2.5" result="blur"/>
	  <feMerge>
		<feMergeNode in="blur"/>
		<feMergeNode in="SourceGraphic"/>
	  </feMerge>
	</filter>
  </defs>

  <rect x="0" y="0" width="960" height="240" rx="16" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="192" rx="12" fill="none" stroke="#334651" stroke-width="2"/>

  <g transform="translate(90,120)">
	<circle cx="0" cy="0" r="42" fill="none" stroke="#8ea3ad" stroke-width="2"/>
	<ellipse cx="0" cy="0" rx="74" ry="26" fill="none" stroke="url(#accent)" stroke-width="3"/>
	<ellipse cx="0" cy="0" rx="56" ry="18" fill="none" stroke="#4a515c" stroke-width="2"/>
	<circle cx="0" cy="0" r="7" fill="#57b7c8" filter="url(#glow)"/>
	<path d="M-6 -58 L6 -58 L2 -75 L-2 -75 Z" fill="#8ea3ad"/>
	<path d="M-58 -4 L-76 4 L-58 12 Z" fill="#4c90f0"/>
	<path d="M58 -4 L76 4 L58 12 Z" fill="#4c90f0"/>
  </g>

  <g transform="translate(200,92)">
	<text x="0" y="0" fill="#d4e1e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1.5">WAYBACK VIEWER</text>
	<text x="0" y="40" fill="#8ea3ad" font-family="Consolas, ui-monospace, monospace" font-size="20" letter-spacing="1.2">ARCHIVE INTELLIGENCE CONSOLE</text>
	<rect x="0" y="56" width="500" height="2" fill="url(#accent)"/>
  </g>
</svg>